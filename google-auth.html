<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión con Google · Hermenia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', -apple-system, sans-serif; }
    body {
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 44px 36px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .google-logo { width: 52px; height: 52px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
    p { font-size: 14px; color: #475569; line-height: 1.5; margin-bottom: 24px; }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #4285F4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .badge-success {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #dcfce7;
      color: #166534;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }
    .badge-error {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="google-logo" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.87c2.27-2.09 3.67-5.17 3.67-9.15z"/>
      <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.87-3.05c-1.08.72-2.45 1.16-4.06 1.16-3.13 0-5.78-2.11-6.73-4.96H1.25v3.15C3.25 21.36 7.35 24 12 24z"/>
      <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.25C.45 8.22 0 10.06 0 12s.45 3.78 1.25 5.39l4.02-3.15z"/>
      <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.25 2.64 1.25 6.61l4.02 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
    </svg>

    <div class="spinner" id="loading-spinner"></div>
    <h1 id="status-title">Conectando con Google...</h1>
    <p id="status-desc">Redirigiendo a la pantalla oficial de inicio de sesión de Google...</p>
    <div id="status-badge"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://zukprpbsyycoxorkscfn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_qlj0XZ-T68FxroJ8ILq7cQ_8N444yW8";
    const REDIRECT_URL = window.location.origin + window.location.pathname;

    async function handleAuth() {
      const hash = window.location.hash ? window.location.hash.substring(1) : "";
      const search = window.location.search ? window.location.search.substring(1) : "";
      const params = new URLSearchParams(hash || search);
      const accessToken = params.get("access_token");

      if (accessToken) {
        document.getElementById("status-title").textContent = "¡Autenticación con Google exitosa!";
        document.getElementById("status-desc").textContent = "Obteniendo datos de tu perfil y sincronizando con Hermenia...";

        try {
          const userRes = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
            headers: {
              "Authorization": `Bearer ${accessToken}`,
              "apikey": SUPABASE_ANON_KEY
            }
          });

          if (!userRes.ok) throw new Error("No se pudo obtener el perfil de Google");
          const userData = await userRes.json();

          const email = userData.email || "";
          const nombre = userData.user_metadata?.full_name || userData.user_metadata?.name || email.split("@")[0];
          const avatar = userData.user_metadata?.avatar_url || userData.user_metadata?.picture || "";

          // Actualizar en Supabase usuarios_registrados
          try {
            await fetch(`${SUPABASE_URL}/rest/v1/usuarios_registrados`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_ANON_KEY,
                "Authorization": `Bearer ${accessToken}`,
                "Prefer": "resolution=merge-duplicates"
              },
              body: JSON.stringify({
                id: userData.id,
                email: email,
                nombre: nombre,
                auth_provider: "google",
                estado: "activo",
                ultimo_acceso: new Date().toISOString()
              })
            });
          } catch {}

          const payload = {
            success: true,
            email: email,
            nombre: nombre,
            avatar: avatar,
            provider: "google",
            sessionToken: accessToken,
            googleId: userData.id
          };

          document.getElementById("loading-spinner").style.display = "none";
          document.getElementById("status-title").textContent = "¡Bienvenido, " + nombre + "!";
          document.getElementById("status-desc").textContent = "Tu cuenta " + email + " ha sido vinculada correctamente. Regresando a la aplicación...";
          document.getElementById("status-badge").innerHTML = '<span class="badge-success">✓ Cuenta de Google vinculada</span>';

          // Notificar a Electron si existe IPC
          if (window.require) {
            try {
              const { ipcRenderer } = window.require("electron");
              ipcRenderer.send("auth:googleSuccess", payload);
            } catch {}
          }

          // Notificar a ventana padre si es web popup
          if (window.opener) {
            window.opener.postMessage({ type: "HERMENIA_GOOGLE_AUTH_SUCCESS", data: payload }, "*");
          }

          localStorage.setItem("hermenia_google_auth_pending", JSON.stringify(payload));

          setTimeout(() => {
            window.close();
          }, 800);

        } catch (err) {
          document.getElementById("loading-spinner").style.display = "none";
          document.getElementById("status-title").textContent = "Error al vincular cuenta";
          document.getElementById("status-desc").textContent = err.message || "No se pudo conectar con el servidor.";
          document.getElementById("status-badge").innerHTML = '<span class="badge-error">✕ Error de vinculación</span>';
        }

      } else {
        // Redirigir directamente al endpoint oficial de OAuth de Google
        const targetRedirect = encodeURIComponent(REDIRECT_URL.startsWith("http") ? REDIRECT_URL : "https://hermenia-web-9vg5.vercel.app/google-auth.html");
        const oauthUrl = `${SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=${targetRedirect}&prompt=select_account`;
        window.location.href = oauthUrl;
      }
    }

    handleAuth();
  </script>
</body>
</html>
